# Day 4 用の nginx 設定。
#
#   8201 : api-a と api-b の2台(ラウンドロビン)              … Step 1, 2
#   8202 : 向き先を1台に切り替える(Blue-Green)               … Step 3
#   8203 : 9割を旧版、1割を新版に流す(カナリア)              … Step 4
#   8204 : 旧版で返事をしつつ、新版にも複製を送る(ミラーリング) … Step 4

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format day4 '$server_port "$request" $status up=$upstream_addr ust=$upstream_status rt=$request_time';
    access_log /dev/stdout day4;
    error_log  /dev/stderr warn;

    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ---------------- Step 1, 2 ----------------
    upstream both {
        server api-a:3000;
        server api-b:3000;
    }
    server {
        listen 8201;
        location / { proxy_pass http://both; }
    }

    # ---------------- Step 3: Blue-Green ----------------
    # 向き先は別ファイルに1行だけ書いておき、それを書き換えて reload する
    upstream active {
        include /etc/nginx/day4-active/upstream.conf;
    }
    server {
        listen 8202;
        location / { proxy_pass http://active; }
    }

    # ---------------- Step 4: カナリア ----------------
    upstream canary {
        server api-a:3000 weight=9;   # 旧版に 9 割
        server api-b:3000 weight=1;   # 新版に 1 割
    }
    server {
        listen 8203;
        location / { proxy_pass http://canary; }
    }

    # ---------------- Step 4: ミラーリング ----------------
    # 複製の送り先。upstream に名前を付けておくと、api-b は起動時に一度だけ IP に変換される。
    # (proxy_pass に直接 http://api-b:3000$request_uri と書くと、変数を含むため
    #  リクエストのたびに名前を引こうとして、resolver の設定が必要になる)
    upstream mirror_target {
        server api-b:3000;
    }
    server {
        listen 8204;
        location / {
            mirror /_mirror;                  # 同じリクエストを /_mirror にも送る(返事は捨てる)
            proxy_pass http://api-a:3000;     # ユーザーへの返事は旧版から
        }
        location = /_mirror {
            internal;                          # 外からは直接呼べない
            proxy_pass http://mirror_target$request_uri;   # 複製は新版へ
        }
    }
}
