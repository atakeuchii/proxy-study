# Day 2 用の nginx 設定。
# 実験ごとに待ち受けるポートを分けてあるので、設定を書き換えずに比べられる。
#
#   8001 : api-a 1台、バッファリングあり(既定)        … Step 2
#   8002 : api-a 1台、バッファリングなし              … Step 2
#   8003 : 3台、ラウンドロビン(既定)                  … Step 3, 4
#   8004 : 3台、least_conn                            … Step 3
#   8005 : 3台、ip_hash                               … Step 4

# ワーカープロセスを1つにする。
# 複数あると、ラウンドロビンの順番や least_conn の接続数をプロセスごとに別々に数えるため、結果が読みにくくなる
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 負荷をかけるとログが大量に出るので、既定では切っておく。
    # 見たいときは off を消して、下の行の先頭の # を外す
    access_log off;
    # log_format day2 '$remote_addr "$request" $status up=$upstream_addr rt=$request_time urt=$upstream_response_time';
    # access_log /dev/stdout day2;
    error_log /dev/stderr warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # どのサーバに届いたかを、返事のヘッダーで見られるようにする(curl -i で確認できる)
    add_header X-Upstream $upstream_addr always;

    # ---------------- 裏のサーバの組 ----------------
    upstream single {
        server api-a:3000;
    }

    upstream rr {                 # 何も書かなければラウンドロビン
        server api-a:3000;
        server api-b:3000;
        server api-c:3000;
    }

    upstream lc {
        least_conn;               # 処理中の接続が一番少ないサーバへ
        server api-a:3000;
        server api-b:3000;
        server api-c:3000;
    }

    upstream iph {
        ip_hash;                  # クライアントの IP から配り先を決める
        server api-a:3000;
        server api-b:3000;
        server api-c:3000;
    }

    # ---------------- Step 2: バッファリング ----------------
    server {
        listen 8001;
        location / {
            proxy_pass http://single;
            # proxy_buffering on; が既定。
            # 返事がメモリのバッファ(proxy_buffers)に入りきらないときは、一時ファイルに書き出す
            # (上限は proxy_max_temp_file_size、既定 1024m)
        }
    }

    server {
        listen 8002;
        location / {
            proxy_pass http://single;
            proxy_buffering off;  # 受け取った分を、溜めずにその場でクライアントへ流す
        }
    }

    # ---------------- Step 3, 4: 負荷分散 ----------------
    server {
        listen 8003;
        location / { proxy_pass http://rr; }
    }

    server {
        listen 8004;
        location / { proxy_pass http://lc; }
    }

    server {
        listen 8005;
        location / { proxy_pass http://iph; }
    }
}
