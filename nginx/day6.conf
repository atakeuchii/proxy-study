# Day 6 用の nginx 設定。同じ api-a に、4つの入口から送る。
#
#   8401 : キャッシュなし                                       … Step 1
#   8402 : キャッシュあり(素朴。アプリの Cache-Control に従うだけ) … Step 2, 3, 4
#   8403 : 8402 ＋ 期限切れの瞬間の殺到を抑える                 … Step 3
#   8404 : 8403 ＋ ログイン中の人にはキャッシュを使わない         … Step 4

worker_processes 1;

events {
    worker_connections 4096;
}

http {
    # どのリクエストがキャッシュでどう扱われたか($upstream_cache_status)をログに出す
    log_format day6 '$server_port "$request" $status cache=$upstream_cache_status rt=$request_time';
    access_log off;       # 負荷をかけるので既定では切る。見たいときは off を消して次の行の # を外す
    # access_log /dev/stdout day6;
    error_log  /dev/stderr warn;

    # ★ キャッシュの置き場所。
    #   /var/cache/nginx/day6 にファイルとして置き、キーの一覧はメモリの articles という領域(10MB)に持つ
    proxy_cache_path /var/cache/nginx/day6 levels=1:2 keys_zone=articles:10m
                     max_size=100m inactive=10m use_temp_path=off;

    proxy_set_header Host $host;

    # キャッシュでどう扱われたかを、返事のヘッダーでも見られるようにする(curl -i で見える)
    add_header X-Cache-Status $upstream_cache_status always;

    upstream app {
        server api-a:3000;
        keepalive 16;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---------------- Step 1: キャッシュなし ----------------
    server {
        listen 8401;
        location / { proxy_pass http://app; }
    }

    # ---------------- Step 2, 3, 4: 素朴なキャッシュ ----------------
    server {
        listen 8402;
        location / {
            proxy_pass  http://app;
            proxy_cache articles;          # ★ キャッシュを使う。
            # キャッシュキーは既定のまま($scheme$proxy_host$request_uri)= URL だけ。Cookie は含まない
            # 有効期限は、アプリが返す Cache-Control: max-age=10 に従う
        }
    }

    # ---------------- Step 3: 期限切れの瞬間の殺到を抑える ----------------
    server {
        listen 8403;
        location / {
            proxy_pass  http://app;
            proxy_cache articles;
            proxy_cache_lock on;                  # ★ 同じキーの MISS は、1つだけアプリに送り、残りは待たせる
            proxy_cache_use_stale updating;       # ★ 更新中は、期限切れの古い返事をそのまま返す
            proxy_cache_background_update on;     # ★ 更新は裏で行い、期限切れに当たった人も待たせない
        }
    }

    # ---------------- Step 4: ログイン中の人にはキャッシュを使わない ----------------
    server {
        listen 8404;
        location / {
            proxy_pass  http://app;
            proxy_cache articles;
            proxy_cache_lock on;
            proxy_cache_use_stale updating;
            proxy_cache_background_update on;
            proxy_cache_bypass $cookie_user;      # ★ Cookie に user があれば、キャッシュから返さない
            proxy_no_cache     $cookie_user;      # ★ その返事を、キャッシュに覚えもしない
        }
    }
}
