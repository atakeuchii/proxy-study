# Day 5 用の nginx 設定。同じ api-a に、3つの入口から送る。
#
#   8301 : 既定のまま(何も対応していない)                   … Step 1〜4 の「問題が起きる側」
#   8302 : 長い接続・大きなデータに対応済み                  … Step 1〜4 の「直した側」
#   8303 : 8302 と同じだが、タイムアウトを5秒に短くしたもの … Step 2, 3(切れる様子を短時間で見るため)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format day5 '$server_port "$request" $status rt=$request_time bytes=$bytes_sent';
    access_log /dev/stdout day5;
    error_log  /dev/stderr warn;

    # WebSocket の切り替えのために、裏へ送る Connection ヘッダーの値を決める。
    #   クライアントが Upgrade を送ってきた → "upgrade"
    #   送ってこなかった(普通のリクエスト) → ""(空。接続を使い回すため。Step 4)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ---------------- 8301: 既定のまま ----------------
    upstream app_default {
        server api-a:3000;
    }
    server {
        listen 8301;
        location / {
            proxy_pass http://app_default;
            proxy_set_header Host $host;
            # 以下はすべて既定値。書かなくても同じ
            # proxy_buffering on;          バッファに溜めてから送る
            # proxy_http_version 1.0;      裏とは HTTP/1.0 で話す(nginx 1.29.7 より前の既定。1.29.7 以降の既定は 1.1)
            # proxy_read_timeout 60s;      60秒データが来なければ切る
            # client_max_body_size 1m;     1MB を超える本文は 413
        }
    }

    # ---------------- 8302: 対応済み ----------------
    upstream app_tuned {
        server api-a:3000;
        keepalive 16;                       # ★ Step 4: 裏への接続を最大16本とっておき、使い回す
    }
    server {
        listen 8302;

        # この server の中のすべての location に効くヘッダー
        proxy_set_header Host       $host;
        proxy_http_version 1.1;                          # ★ Step 3, 4: WebSocket と接続の使い回しに必要
        proxy_set_header Upgrade    $http_upgrade;       # ★ Step 3: 届いた Upgrade を裏へ引き継ぐ
        proxy_set_header Connection $connection_upgrade; # ★ Step 3, 4: 上の map で決めた値

        location / {
            proxy_pass http://app_tuned;
        }

        location /events {
            proxy_pass http://app_tuned;
            proxy_buffering off;            # ★ Step 1: 溜めずに、受け取ったらすぐ流す
            proxy_read_timeout 1h;          # ★ Step 2: 長くつながったままでも切らない
        }

        location /ws {
            proxy_pass http://app_tuned;
            proxy_read_timeout 1h;          # ★ Step 2, 3: 何も送られてこなくても切らない
        }

        location /upload {
            proxy_pass http://app_tuned;
            client_max_body_size 100m;      # ★ Step 4: 100MB まで受け付ける
        }
    }

    # ---------------- 8303: 対応済みで、タイムアウト5秒 ----------------
    server {
        listen 8303;
        proxy_set_header Host       $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location / {
            proxy_pass http://app_tuned;
            proxy_buffering off;
            proxy_read_timeout 5s;          # ★ Step 2: 5秒データが来なければ切る
        }
    }
}
