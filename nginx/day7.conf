# Day 7 用の nginx 設定。
#
#   Step 1: 本当のクライアント IP
#     8601 : 手前のプロキシ(CDN や ALB の代わり) → 8611
#     8611 : realip なし。直接の接続元(= 手前のプロキシ)を X-Real-IP として渡す
#     8602 : 手前のプロキシ(CDN や ALB の代わり) → 8612
#     8612 : realip あり。手前のプロキシが書いた X-Forwarded-For から、本当のクライアント IP を求めて渡す
#   Step 2: レート制限
#     8603 : 1 IP あたり毎秒5件。burst=10 nodelay
#     8604 : 1 IP あたり毎秒5件。burst なし
#   Step 3: 遅い攻撃
#     8605 : タイムアウトは既定のまま(ヘッダー 60秒、本文 60秒)
#     8606 : ヘッダーのタイムアウト 10秒 ＋ 1 IP あたりの同時接続数 10
#   Step 4: 情報を漏らさない
#     8607 : バージョンを出さない ＋ セキュリティヘッダー

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format day7 '$server_port remote=$remote_addr direct=$realip_remote_addr "$request" $status xff="$http_x_forwarded_for"';
    access_log /dev/stdout day7;
    error_log  /dev/stderr warn;

    upstream app {
        server api-a:3000;
    }

    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 届いた XFF の右に、$remote_addr を追記
    proxy_set_header X-Real-IP       $remote_addr;                 # nginx が「クライアントの IP」と思っている値

    # ================= Step 1: 本当のクライアント IP =================

    # 手前のプロキシ(CDN や ALB の代わり)。同じ nginx の中で、内側の入口に送る
    server {
        listen 8601;
        location / { proxy_pass http://127.0.0.1:8611; }
    }
    server {
        listen 8602;
        location / { proxy_pass http://127.0.0.1:8612; }
    }

    # realip なし
    server {
        listen 8611;
        location / { proxy_pass http://app; }
    }

    # ★ realip あり
    server {
        listen 8612;
        set_real_ip_from  127.0.0.1;         # ★ 手前のプロキシ(127.0.0.1)から来たときだけ、ヘッダーを信じる
        real_ip_header    X-Forwarded-For;   # ★ 本当のクライアント IP は X-Forwarded-For に書いてある
        real_ip_recursive on;                # ★ 右から辿り、信頼できるプロキシを飛ばして最初の IP を採用する
        location / { proxy_pass http://app; }
    }

    # ================= Step 2: レート制限 =================

    # ★ 接続元の IP ごとに数える。毎秒5件まで
    limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=perip2:10m rate=5r/s;   # 8604 用(8603 と数を混ぜないため、別に数える)
    limit_req_status 429;                    # ★ 断ったら 429 を返す(既定は 503)

    server {
        listen 8603;
        location / {
            limit_req zone=perip burst=10 nodelay;   # ★ 速さを超えても10件までは受け付け、待たせずに処理する
            proxy_pass http://app;
        }
    }
    server {
        listen 8604;
        location / {
            limit_req zone=perip2;                   # ★ burst なし。速さを超えた分はすぐ断る
            proxy_pass http://app;
        }
    }

    # ================= Step 3: 遅い攻撃 =================

    server {
        listen 8605;
        # 既定値: client_header_timeout 60s; client_body_timeout 60s;
        location / { proxy_pass http://app; }
        location = /not-found { return 404; }   # Step 4 の比較用: nginx 自身のエラーページを出す
    }

    limit_conn_zone $binary_remote_addr zone=perconn:10m;
    limit_conn_status 429;

    server {
        listen 8606;
        client_header_timeout 10s;           # ★ ヘッダーを10秒で受け取り終えなければ切る(全体の時間)
        limit_conn perconn 10;               # ★ 1つの IP からの同時接続は10本まで
        location / { proxy_pass http://app; }
    }

    # ================= Step 4: 情報を漏らさない =================

    server {
        listen 8607;
        server_tokens off;                   # ★ Server ヘッダーとエラーページに、バージョンを出さない

        # ★ セキュリティヘッダー(always: エラーの返事にも付ける)
        add_header Strict-Transport-Security "max-age=31536000" always;   # 今後は https でしか開かない(https で返したときだけ有効)
        add_header X-Content-Type-Options    "nosniff"                    always;   # Content-Type を推測させない
        add_header X-Frame-Options           "DENY"                       always;   # 他のサイトに埋め込ませない
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        location / { proxy_pass http://app; }
        location = /not-found { return 404; }
    }
}
