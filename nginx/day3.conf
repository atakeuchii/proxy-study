# Day 3 用の nginx 設定。実験ごとに待ち受けるポートを分けてある。
#
#   8101 : 既定のまま(やり直しあり、パッシブヘルスチェックあり、タイムアウト60秒)  … Step 1, 2
#   8102 : やり直しなし(proxy_next_upstream off)                                    … Step 1
#   8103 : タイムアウト1秒(やり直しあり、POST はやり直さない)                       … Step 2, 3
#   8104 : タイムアウト1秒、POST もやり直す(non_idempotent)                         … Step 3
#   8105 : 2段構えのリトライ(外側 → 内側 9201〜9203 → api)                          … Step 4
#   8106 : 1段だけのリトライ(比較用)                                               … Step 4

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # リクエスト ID。手前のプロキシ(Step 4 の外側の段)が付けてきたものがあればそれを使い、
    # なければ nginx が作る($request_id は nginx が作るランダムな32文字)
    map $http_x_request_id $rid {
        ""      $request_id;
        default $http_x_request_id;
    }

    # どのサーバに、何回、何秒かけて送ったかをログに出す。
    # やり直した場合、up / ust / urt はサーバごとにカンマで並ぶ
    log_format day3 '$server_port rid=$rid "$request" $status '
                    'up=$upstream_addr ust=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout day3;
    error_log  /dev/stderr warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $rid;     # アプリのログと突き合わせるため

    # 返事のヘッダーにも、どのサーバとやりとりしたかを付ける(curl -i で見える)
    add_header X-Upstream  $upstream_addr always;
    add_header X-Request-Id $rid always;

    # ---------------- 裏のサーバの組 ----------------

    # Step 1: パッシブヘルスチェックあり(nginx の既定値をそのまま書いたもの)
    # 「10秒の間に1回失敗したら、そのサーバを10秒間使わない」
    upstream api_default {
        server api-a:3000 max_fails=1 fail_timeout=10s;
        server api-b:3000 max_fails=1 fail_timeout=10s;
        server api-c:3000 max_fails=1 fail_timeout=10s;
    }

    # Step 2〜4: パッシブヘルスチェックなし(max_fails=0)。
    # 失敗したサーバを外す効果が混ざると、タイムアウトやリトライの効果が見えにくくなるため
    upstream api_nohc {
        server api-a:3000 max_fails=0;
        server api-b:3000 max_fails=0;
        server api-c:3000 max_fails=0;
    }

    # Step 4: 外側の段から見た「内側の段」(同じ nginx の 9201〜9203 番)
    upstream inner_tier {
        server 127.0.0.1:9201 max_fails=0;
        server 127.0.0.1:9202 max_fails=0;
        server 127.0.0.1:9203 max_fails=0;
    }

    # ---------------- Step 1 ----------------
    server {
        listen 8101;
        location / {
            proxy_pass http://api_default;
            # 以下はすべて nginx の既定値。書かなくても同じ
            # proxy_next_upstream error timeout;  # 接続の失敗とタイムアウトなら、別のサーバでやり直す(POST は除く)
            # proxy_connect_timeout 60s;
            # proxy_read_timeout    60s;
        }
    }

    server {
        listen 8102;
        location / {
            proxy_pass http://api_default;
            proxy_next_upstream off;             # どんな失敗でも、やり直さない
        }
    }

    # ---------------- Step 2, 3 ----------------
    server {
        listen 8103;
        location / {
            proxy_pass http://api_nohc;
            proxy_connect_timeout 1s;
            proxy_read_timeout    1s;            # 1秒待っても返事が来なければ、タイムアウトとして扱う
            proxy_next_upstream error timeout;   # 既定と同じ。POST はやり直さない
        }
    }

    server {
        listen 8104;
        location / {
            proxy_pass http://api_nohc;
            proxy_connect_timeout 1s;
            proxy_read_timeout    1s;
            proxy_next_upstream error timeout non_idempotent;   # POST もやり直す
        }
    }

    # ---------------- Step 4: リトライストーム ----------------
    # 外側の段: 500 が返ってきたら、別の内側のサーバでやり直す(最大3台)
    server {
        listen 8105;
        location / {
            proxy_pass http://inner_tier;
            proxy_next_upstream error timeout http_500;
            proxy_next_upstream_tries 3;
        }
    }

    # 内側の段(3台分): 500 が返ってきたら、別の api でやり直す(最大3台)
    server {
        listen 9201;
        listen 9202;
        listen 9203;
        location / {
            proxy_pass http://api_nohc;
            proxy_next_upstream error timeout http_500;
            proxy_next_upstream_tries 3;
        }
    }

    # 比較用: 1段だけでリトライする
    server {
        listen 8106;
        location / {
            proxy_pass http://api_nohc;
            proxy_next_upstream error timeout http_500;
            proxy_next_upstream_tries 3;
        }
    }
}
