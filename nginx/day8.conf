# Day 8 用の nginx 設定。
#
#   8701 : Basic 認証                                          … Step 1
#   8702 : 認証の前段化(auth_request) → 認証サービスに問い合わせ  … Step 2〜4

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format day8 '$server_port "$request" $status user=$remote_user auth_user=$auth_user';
    access_log /dev/stdout day8;
    error_log  /dev/stderr warn;

    upstream app  { server api-a:3000; }   # アプリ
    upstream auth { server auth:3000; }    # 認証サービス


    # ================= Step 1: Basic 認証 =================
    server {
        listen 8701;
        set $auth_user "";

        location /mypage/ {
            auth_basic           "staff only";                     # ★ Basic 認証をかける
            auth_basic_user_file /etc/nginx/day8.htpasswd;         # ★ ユーザー名とパスワードのファイル
            proxy_set_header Host        $host;
            proxy_set_header X-Auth-User $remote_user;             # ★ 認証できたユーザー名をアプリに渡す
            proxy_pass http://app;
        }
    }

    # ================= Step 2〜4: 認証の前段化 =================
    server {
        listen 8702;
        set $auth_user "";

        # ログイン(認証サービスがトークンを Cookie で渡す)
        location = /login {
            proxy_pass http://auth/auth/login$is_args$args;
        }

        # ログインした人だけ(ルール: 誰でもよいが、ログインしていること)
        location /mypage/ {
            auth_request     /_auth;                                     # ★ 送る前に、認証サービスに問い合わせる
            auth_request_set $auth_user $upstream_http_x_auth_user;      # ★ 認証サービスの返事の X-Auth-User を取り出す
            proxy_set_header Host        $host;
            proxy_set_header X-Auth-User $auth_user;                     # ★ それをアプリに渡す(クライアントが書いた値は上書きされる)
            proxy_pass http://app;
        }

        # 役割が admin の人だけ(ルールA: 入口でできる認可)
        location /admin/ {
            auth_request     /_auth_admin;                               # ★ 役割も確かめる問い合わせ先
            auth_request_set $auth_user $upstream_http_x_auth_user;
            proxy_set_header Host        $host;
            proxy_set_header X-Auth-User $auth_user;
            proxy_pass http://app;
        }

        # 認証サービスへの問い合わせ(nginx の内部からだけ呼べる)
        location = /_auth {
            internal;
            proxy_pass              http://auth/auth/check;
            proxy_pass_request_body off;            # 本文は送らない(ヘッダーの Cookie だけで判断する)
            proxy_set_header        Content-Length "";
        }
        location = /_auth_admin {
            internal;
            proxy_pass              http://auth/auth/check?require=admin;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }
    }
}
