events {}

# =================================================================
# L7: HTTP として中身を読んで振り分ける
# =================================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # アクセスログ: 接続元、リクエスト、ホスト名、どの upstream に送ったか
    log_format main '$remote_addr "$request" $status host=$host upstream=$upstream_addr';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # 裏へ渡すときに付けるヘッダー(location で proxy_set_header を書かなければ全てに効く)
    proxy_set_header Host              $host;                       # 元のホスト名をそのまま渡す
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # 接続元IPを右に追記する
    proxy_set_header X-Forwarded-Proto $scheme;                     # 元のスキーム(http/https)
    proxy_set_header X-Forwarded-Host  $host;

    upstream api_a { server api-a:3000; }
    upstream api_b { server api-b:3000; }

    # -------------------------------------------------------------
    # Step 2: パスで振り分ける (http://localhost/)
    # -------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name localhost;

        root /usr/share/nginx/html;          # フロントは nginx が直接返す
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 末尾の / に注意: /api/a/whoami → api-a には /whoami として届く
        location /api/a/ { proxy_pass http://api_a/; }
        location /api/b/ { proxy_pass http://api_b/; }
    }

    # -------------------------------------------------------------
    # Step 2: ホスト名で振り分ける (名前ベースのバーチャルホスト)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name api-a.localhost;
        location / { proxy_pass http://api_a; }
    }
    server {
        listen 80;
        server_name api-b.localhost;
        location / { proxy_pass http://api_b; }
    }

    # -------------------------------------------------------------
    # Step 3: TLS終端 (https://localhost/ と https://api-a.localhost/)
    # -------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    server {
        listen 443 ssl default_server;
        server_name localhost;

        root /usr/share/nginx/html;
        location / {
            try_files $uri $uri/ /index.html;
        }
        location /api/a/ { proxy_pass http://api_a/; }
        location /api/b/ { proxy_pass http://api_b/; }
    }
    server {
        listen 443 ssl;
        server_name api-a.localhost;
        location / { proxy_pass http://api_a; }
    }
    server {
        listen 443 ssl;
        server_name api-b.localhost;
        location / { proxy_pass http://api_b; }
    }
}

# =================================================================
# Step 4: L4 で中身を読まずに流す(振り分けの単位はポート)
# =================================================================
stream {
    log_format l4 '$remote_addr -> $upstream_addr bytes_in=$bytes_received bytes_out=$bytes_sent';
    access_log /dev/stdout l4;

    server { listen 9001; proxy_pass api-a:3000; }
    server { listen 9002; proxy_pass api-b:3000; }
}
